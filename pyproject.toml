[project]
name = "lata"
version = "2.0.2"
description = "LaTA (Large Language Teaching Assistant) - Automated grading workflow for LaTeX-based STEM assignments using open-source LLMs"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
authors = [
    { name = "Jesse A. Rodriguez" },
]
keywords = ["grading", "education", "llm", "latex", "automated-grading", "teaching-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "instructor>=1.0.0",
    "jinja2>=3.1.0",
    "ollama>=0.4.0",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "pydantic>=2.0.0",
    "pylatexenc>=2.10",
    "pypdf2>=3.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
gradescope = [
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lata"]
